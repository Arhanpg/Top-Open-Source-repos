name: Public GitHub repository catalogue

on:
  workflow_dispatch:
    inputs:
      company:
        description: "Company name or GitHub account login; blank means all verified, official-directory-listed or official-project-linked mappings"
        required: false
        type: string
      include_unverified:
        description: "Include unverified candidate mappings (research leads only; normally excluded)"
        required: false
        default: false
        type: boolean
      enrich_limit:
        description: "README/manifest captures per account per run (0 = all pending)"
        required: false
        default: 20
        type: number
      total_enrich_limit:
        description: "Global README/manifest captures across all eligible accounts per run"
        required: false
        default: 1200
        type: number
      audit_limit:
        description: "Technical-audit YAML/Markdown dossiers to generate per run"
        required: false
        default: 200
        type: number
      audit_force:
        description: "Regenerate existing technical-audit dossiers"
        required: false
        default: false
        type: boolean
      refresh_inventory:
        description: "Re-enumerate every public repository page from page one"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "docs/TECHNICAL-AUDIT-*.md"
      - ".github/workflows/catalogue-inventory.yml"
  push:
    branches: [main]
    paths:
      - "config/company_accounts.csv"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/catalogue-inventory.yml"
  schedule:
    - cron: "23 2,8,14,20 * * *"
    - cron: "23 1 * * 0"

permissions:
  contents: write

concurrency:
  group: public-repository-catalogue-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate collector and run offline unit tests
        run: |
          python -m py_compile scripts/catalogue_audit.py scripts/audit_org_repos.py scripts/repository_technical_audit.py
          python -m unittest discover -s tests -v

      - name: Inventory accounts and capture README evidence
        if: github.event_name != 'pull_request'
        id: scan
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPANY: ${{ inputs.company || '' }}
          INCLUDE_UNVERIFIED: ${{ inputs.include_unverified }}
          ENRICH_LIMIT: ${{ inputs.enrich_limit }}
          TOTAL_ENRICH_LIMIT: ${{ inputs.total_enrich_limit }}
          REFRESH_INVENTORY: ${{ inputs.refresh_inventory }}
          SCHEDULE_CRON: ${{ github.event.schedule || '' }}
        run: |
          if [ -z "$ENRICH_LIMIT" ]; then ENRICH_LIMIT=20; fi
          if [ -z "$TOTAL_ENRICH_LIMIT" ]; then TOTAL_ENRICH_LIMIT=1200; fi
          # Routine daily runs use one global repository budget across eligible accounts.
          args=(--phase enrich --mapping config/company_accounts.csv --total-enrich-limit "$TOTAL_ENRICH_LIMIT" --manifest-limit 6 --delay 0.1)
          if [ -n "$COMPANY" ]; then args+=(--company "$COMPANY"); fi
          if [ "$INCLUDE_UNVERIFIED" = "true" ]; then args+=(--include-unverified); fi

          # Weekly inventory refresh (Sunday 01:23 UTC) is separate from daily enrichment.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_CRON" = "23 1 * * 0" ]; then
            args=(--phase inventory --mapping config/company_accounts.csv --refresh-inventory --delay 0.1)
          elif [ "$REFRESH_INVENTORY" = "true" ]; then
            args=(--phase all --mapping config/company_accounts.csv --refresh-inventory --enrich-limit "$ENRICH_LIMIT" --manifest-limit 6 --delay 0.1)
            if [ -n "$COMPANY" ]; then args+=(--company "$COMPANY"); fi
            if [ "$INCLUDE_UNVERIFIED" = "true" ]; then args+=(--include-unverified); fi
          fi
          python scripts/catalogue_audit.py "${args[@]}"



      - name: Generate per-repository technical-audit YAML and Markdown dossiers
        id: technical_audit
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_LLM_API_KEY: ${{ secrets.AUDIT_LLM_API_KEY || secrets.OPENROUTER_API_KEY || '' }}
          AUDIT_LLM_BASE_URL: ${{ vars.AUDIT_LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          AUDIT_LLM_MODEL: ${{ vars.AUDIT_LLM_MODEL || '' }}
          AUDIT_LIMIT: ${{ inputs.audit_limit || 200 }}
          AUDIT_COMPANY: ${{ inputs.company || '' }}
          AUDIT_FORCE: ${{ inputs.audit_force }}
        run: |
          limit="${AUDIT_LIMIT:-200}"
          args=(--limit "$limit")
          if [ -n "$AUDIT_COMPANY" ]; then args+=(--company "$AUDIT_COMPANY"); fi
          if [ "$AUDIT_FORCE" = "true" ]; then args+=(--force); fi
          python scripts/repository_technical_audit.py "${args[@]}"

      - name: Commit checkpoints and generated evidence directly to main
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add organizations/ docs/TECHNICAL-AUDIT-PROGRESS.md
          if git diff --cached --quiet; then
            echo "No generated catalogue changes to commit."
            exit 0
          fi
          git commit -m "Update public repository inventories and README evidence"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Surface scan or technical-audit failure after committing checkpoints
        if: steps.scan.outcome == 'failure' || steps.technical_audit.outcome == 'failure'
        run: |
          echo "The inventory scan or technical-audit batch encountered errors. Successful checkpoints and dossiers were committed where possible; rerun to resume."
          exit 1

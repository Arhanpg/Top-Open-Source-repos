analysis:
  purpose: '**Tencent Transaction Processing Testbed System (3TS)** that is jointly developed by Tencent''s TDSQL
    team and the Key Laboratory of Data Engineering and Knowledge Engineering of the Ministry of Education of Renmin
    University of China. The system aims to design and construct a unified framework for transaction processing
    (including distributed transactions). It enables users to quickly build new concurrency control approaches via
    the access interface provided by the framework. Based on an comprehensive experiment study over the benchmarks,
    and the applications abstracted, users can select an optimal concurrency control approach. At present, 3TS has
    been integrated 13 mainstream concurrency control approaches, and provides common benchmarks such as TPC-C，PPS
    and YCSB. 3TS further provides a consistency level test benchmark, to address the issue of system selection
    difficulty caused by the '

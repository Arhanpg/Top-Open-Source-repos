analysis:
  purpose: '**CUARewardBench** is the first comprehensive benchmark for evaluating reward models on Computer-Using
    Agent (CUA) tasks. While script-based verifiers are widely adopted for CUA evaluation, they suffer from limited
    scalability and inability to provide step-wise assessment. Reward models offer promising alternatives, but their
    effectiveness on CUA evaluation remains largely underexplored.'

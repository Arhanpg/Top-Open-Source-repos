  setup_and_usage:
  - 'Getting Started: SourceKit-LSP is included in the Swift toolchains available on swift.org and is bundled with
    Xcode.'
  - 'Getting Started: swift.org/tools has a list of popular editors that support LSP and can thus be hooked up to
    SourceKit-LSP to provide intelligent editor functionality as well as set-up guides.'
  - 'Getting Started: > SourceKit-LSP does not update its global index in the background or build Swift modules
    in the background. Thus, a lot of cross-module or global functionality is limited if the project hasn''t been
    built recently. To update the index or rebuild the Swift modules, build your project or enable the experimental
    background indexing as described in Ena'
  - 'Getting Started: To learn more about SourceKit-LSP, refer to the Documentation.'
  - 'Getting Started: > If you are using SourceKit-LSP with a SwiftPM project in which you need to pass additional
    arguments to the swift build invocation, as is commonly the case for embedded projects, you need to teach SourceKit-LSP
    about those arguments as described in Using SourceKit-LSP with Embedded Projects.'

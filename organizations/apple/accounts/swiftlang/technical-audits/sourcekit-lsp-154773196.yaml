analysis:
  purpose: SourceKit-LSP is an implementation of the Language Server Protocol (LSP) for Swift and C-based languages.
    It provides intelligent editor functionality like code-completion and jump-to-definition to editors that support
    LSP. SourceKit-LSP is built on top of sourcekitd and clangd for high-fidelity language support, and provides
    a powerful source code index as well as cross-language support. SourceKit-LSP supports projects that use the
    Swift Package Manager and projects that generate a compile_commands.json file, such as CMake.
  why_used: Language Server Protocol implementation for Swift and C-based languages

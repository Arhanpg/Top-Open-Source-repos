analysis:
  purpose: IndexStoreDB is a source code indexing library. It provides a composable and efficient query API for
    looking up source code symbols, symbol occurrences, and relations. IndexStoreDB uses the libIndexStore library,
    which lives in swiftlang/llvm-project, for reading raw index data. Raw index data can be produced by compilers
    such as Apple Clang and Swift using the -index-store-path option. IndexStoreDB enables efficiently querying
    this data by maintaining acceleration tables in a key-value database built with LMDB.
  why_used: Index database library for use with sourcekit-lsp

analysis:
  purpose: The ICASSP 2023 Acoustic Echo Cancellation Challenge is intended to stimulate research in acoustic echo
    cancellation (AEC), which is an important area of speech enhancement and is still a top issue in audio communication.
    This is the fourth AEC challenge and it is enhanced by adding a second track for personalized acoustic echo
    cancellation, reducing the algorithmic+buffering latency to 20ms, and including a full-band version of AECMOS.
    We open source two large datasets to train AEC models under both single talk and double talk scenarios. These
    datasets consist of recordings from more than 10,000 real audio devices and human speakers in real environments,
    as well as a synthetic dataset. We open source an online subjective test framework and provide an online objective
    metric service for researchers to quickly test their results. The winners of this challenge were selected based

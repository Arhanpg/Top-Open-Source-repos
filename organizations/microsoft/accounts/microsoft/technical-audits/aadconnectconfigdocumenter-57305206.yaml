  setup_and_usage:
  - '**How to use the tool** (if you want to generate report for the current server installation):: 1. Download
    the latest release AzureADConnectSyncDocumenter.zip from the releases tab under the Code tab tab, UNBLOCK the
    downloaded zip file and extract the zip file to an empty local folder on a machine which has .NET Framework
    4.5 installed.'
  - '**How to use the tool** (if you want to generate report for the current server installation):: * This will
    extract the Documenter application binaries along with the sample data files for "Contoso".'
  - '**How to use the tool** (if you want to generate report for the current server installation):: * Make sure
    that the tool runs by double-clicking on the cmd file AzureADConnectSyncDocumenter.cmd.'
  - '**How to use the tool** (if you want to generate report for the current server installation):: * Upon successful
    execution, the generated report for "Contoso" will be found in the Documenter "Report" folder.'
  - '**How to use the tool** (if you want to generate report for the current server installation):: 2. Export the
    Server Configuration of your Azure AD Connect sync server (named "AADC-SERVER01" in the example below) by running
    Get-ADSyncServerConfiguration cmdlet defined in ADSync module shipped with Azure AD Connect as in the example
    below.'
  - '**How to use the tool** (if you want to generate report for the current server installation):: Get-ADSyncServerConfiguration
    -Path "C:\Temp\AADC-SERVER01-06JUN2022"'
  - '**How to use the tool** (if you want to generate report for the current server installation):: 3. Copy the
    configuration export files folder produced in the previous step ("AADC-SERVER01-06JUN2022") to the "Data" directory
    of the Documenter tool.'
  - '**How to use the tool** (if you want to generate report for the current server installation):: 4. Open a command
    prompt and change directory to AzureADConnectSyncDocumenter which should have AzureADConnectSyncDocumenterCmd.exe
    executable of the tool. Run the tool as follows to generate the report'

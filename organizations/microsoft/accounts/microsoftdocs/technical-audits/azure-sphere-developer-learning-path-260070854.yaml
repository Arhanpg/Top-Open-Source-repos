  limitations:
  - 'Why you should care about IoT security: Almost a day doesn''t go by without some newsworthy IoT security attack
    happening, and those are just the ones that make the news cycle. IoT security is fundamental and at the same
    time often absent from many conversations in the rush to get products to market.'
  - 'Why you should care about IoT security: The Seven Properties of Highly Secure Devices is highly recommended
    to help you understand what is required to mitigate exposure to IoT security issues. This IoT Security whitepaper
    draws from industry and Microsoft experience.'
  - 'Why you should care about IoT security: Here is one of the most unconventional: a fish tank. Not just an ordinary
    fish tank, mind you, but a high-tech one that featured Internet connectivity. That connection allowed the tank
    to be remotely monitored, automatically adjust temperature and salinity, and automate feedings.'
  - 'Why you should care about IoT security: It also allowed hackers to swipe 10 gigabytes of data from the North
    American casino that just installed it, according to a report from the threat intelligence experts at Darktrace.'
  - 'Why you should care about IoT security: Criminals Hacked A Fish Tank To Steal Data From A Casino'
  - 'Security: * Applications on Azure Sphere are locked down by default and you must grant capabilities to the
    application. This is key to Azure Sphere security and is also known as the Principle of least privilege.'
  - 'Security: * Capabilities, such as access to GPIO pins and network endpoint must be granted to both High Level
    and Real Time applications. This defends against application bugs and malicious code attacks.'
  - 'Security: * The chip includes a Memory Management Unit (MMU) to provide protected memory address spaces.'

analysis:
  purpose: Deploying machine learning models can often be tricky due to their numerous dependencies, deep learning
    models often even more so. One of the ways to overcome this is to use Docker containers. Unfortunately, it is
    rarely straight-forward. In this tutorial, we will demonstrate how to deploy a pre-trained deep learning model
    using Azure Container Services, which allows us to orchestrate a number of containers using DC/OS. By using
    Azure Container Services, we can ensure that it is performant, scalable and flexible enough to accommodate any
    deep learning framework. The Docker image we will be deploying can be found here. It contains a simple Flask
    web application with Nginx web server. The deep learning framework we will use is the Microsoft Cognitive Toolkit
    (CNTK) and we will be using a pre-trained model; specifically the ResNet 152 model.
  why_used: A tutorial on how to deploy a Dockerised deep learning application on Azure Container Services

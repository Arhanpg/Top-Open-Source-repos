analysis:
  purpose: ClangSharp provides Clang bindings written in C#. It is self-hosted and auto-generates itself by parsing
    the Clang C header files using ClangSharpPInvokeGenerator.
  why_used: Clang bindings for .NET written in C#
  core_features:
  - name: Auto-generated using Clang C headers files, and supports all functionality exposed by them ~ which means
      you can build tooling around C/C++
    description: Auto-generated using Clang C headers files, and supports all functionality exposed by them ~ which
      means you can build tooling around C/C++
    evidence:
    - README.md#Features
  - name: Exposes the raw unsafe API for performance
    description: Exposes the raw unsafe API for performance
    evidence:
    - README.md#Features
  - name: Exposes a slightly higher abstraction that is type safe (CXIndex and CXTranslationUnit are different types,
      despite being pointers internally)
    description: Exposes a slightly higher abstraction that is type safe (CXIndex and CXTranslationUnit are different
      types, despite being pointers internally)
    evidence:
    - README.md#Features
  - name: Exposes an again slightly higher abstraction that tries to mirror the Clang C++ Type Hierarchy where possible
    description: Exposes an again slightly higher abstraction that tries to mirror the Clang C++ Type Hierarchy
      where possible
    evidence:
    - README.md#Features
  - name: Nearly identical to the Clang C APIs, e.g. clang_getDiagnosticSpelling in C, vs. clang.getDiagnosticSpelling
      (notice the . in the C# API)
    description: Nearly identical to the Clang C APIs, e.g. clang_getDiagnosticSpelling in C, vs. clang.getDiagnosticSpelling
      (notice the . in the C# API)
    evidence:
    - README.md#Features

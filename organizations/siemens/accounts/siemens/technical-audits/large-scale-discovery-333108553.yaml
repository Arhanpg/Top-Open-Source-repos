  purpose: Large-Scale Discovery is a solution for discovering assets, services and contents and metadata within
    large IT/OT networks. It relies on a few basic well-known open-source tools (Nmap , SSLyze) and is extended
    with additional scan logic and several custom scan modules.
  why_used: A network scanning solution for information gathering in large IT/OT network environments.

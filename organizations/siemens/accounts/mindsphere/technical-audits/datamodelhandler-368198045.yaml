analysis:
  purpose: 'This is an application that allows to import, export and delete MindSphere data models using csv-files
    as exchange format. Additionally mass agent creation, deriving of device-assets and mapping is fully supported.
    For now, the mode of operation has to be specified for a script run using the config-file or during execution
    The four possible modes are: import, export, delete, agents'

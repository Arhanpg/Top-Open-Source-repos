analysis:
  purpose: '> [!WARNING] > ### Breaking change starting with version 4.0.0 > > Insights Hub URLs are migrating from
    the mindsphere.io domain to the new siemens.app scheme. **Version 4.0.0 and above only work with the new siemens.app
    URLs** and are **not compatible** with tenants/gateways still using the old mindsphere.io URLs. > > - If your
    tenant/gateway already uses the new siemens.app URLs, install @mindconnect/mindconnect-nodejs@^4.0.0. > - If
    your tenant/gateway still uses the old mindsphere.io URLs, keep using @mindconnect/mindconnect-nodejs@^3.0.0
    (the 3.x line will continue to work with the old URL scheme). > > **4.0.0 is best-effort compatible with the
    new Xcelerator gateway** - it has been tested against the current public-cloud regions, but the migration is
    still in progress and some backend behavior (see below) is known to differ across deployments. **For on-premise/private-cloud
    install'

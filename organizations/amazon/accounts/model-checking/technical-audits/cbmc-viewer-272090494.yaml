analysis:
  purpose: CBMC is a Bounded Model Checker for C. It can prove that (for computations of bounded depth) a C program
    exhibits no memory safe errors (no buffer overflows, no invalid pointers, etc), no undefined behaviors, and
    no failures of assertions in the code. CBMC Viewer is a tool that scans the output of CBMC and produces a browsable
    summary of its findings.
  why_used: CBMC Viewer scans the output of CBMC and produces a browsable summary of its findings, making it easy
    to root cause the issues it finds.

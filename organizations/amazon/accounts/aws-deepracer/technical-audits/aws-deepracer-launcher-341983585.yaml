analysis:
  purpose: The AWS DeepRacer vehicle is a Wi-Fi enabled physical vehicle that can drive itself on a physical track
    by using a reinforcement learning model. This repository contains the robot application code shipped with the
    AWS DeepRacer hardware. It also includes examples demonstrating how you can extend the AWS DeepRacer application
    for new scenarios. For example, the Follow the Leader (FTL) sample project shows how you can use object detection
    and navigation to modify the vehicle application to follow you as you move about in a room.

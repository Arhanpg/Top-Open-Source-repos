analysis:
  purpose: The AWS DeepRacer Offroad sample project is a sample application built on top of the existing AWS DeepRacer
    application. It uses QR code detection, through which the AWS DeepRacer device can identify and navigate along
    a path set up using QR codes to guide the car. For detailed information on the AWS DeepRacer Offroad sample
    project, see the AWS DeepRacer Offroad sample project getting started documentation.
  why_used: Use a series of QR codes as waypoints to navigate the AWS DeepRacer around a custom path. Create your
    own custom path by placing the basic waypoint codes as a sequence along the track or encode additional instructions
    in them to invent new applications.

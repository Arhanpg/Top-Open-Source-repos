analysis:
  purpose: The AWS DeepRacer Evo vehicle is a 1/18th scale Wi-Fi enabled 4-wheel ackermann steering platform that
    features two RGB cameras and a LiDAR sensor. This repository contains the configuration and launch files to
    enable ROS Navigation Stack on AWS DeepRacer and control the vehicle using teleop-twist-keyboard, along with
    the core components to integrate AWS DeepRacer with ROS Navigation stack. For detailed information, see Introduction
    to the ROS Navigation stack using AWS DeepRacer Evo.
  why_used: Simulation artifacts, core components and configuration files to integrate AWS DeepRacer device with
    ROS Navigation stack.

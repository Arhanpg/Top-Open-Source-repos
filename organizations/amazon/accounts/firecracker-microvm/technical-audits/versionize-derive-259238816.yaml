analysis:
  purpose: '**Versionize is a framework for version tolerant serializion/deserialization of Rust data structures,
    designed for usecases that need fast deserialization times and minimal size overhead. It does not aim to be
    a generic serialization framework and only the bincode backend is supported.**'

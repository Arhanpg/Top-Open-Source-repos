analysis:
  purpose: This is a tool which injects a Java agent into a running JVM process. The agent will attempt to patch
    the lookup() method of all loaded org.apache.logging.log4j.core.lookup.JndiLookup instances to unconditionally
    return the string "Patched JndiLookup::lookup()". It is designed to address the CVE-2021-44228 remote code execution
    vulnerability in Log4j without restarting the Java process. This tool will also address CVE-2021-45046.
  why_used: An  agent to hotpatch the log4j RCE from CVE-2021-44228.

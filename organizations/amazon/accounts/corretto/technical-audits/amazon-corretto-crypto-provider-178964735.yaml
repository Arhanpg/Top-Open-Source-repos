analysis:
  purpose: The Amazon Corretto Crypto Provider (ACCP) is a collection of high-performance cryptographic implementations
    exposed via the standard JCA/JCE interfaces. This means that it can be used as a drop in replacement for many
    different Java applications. (Differences from the default OpenJDK implementations are documented here.) As
    of 2.0.0, algorithms exposed by ACCP are primarily backed by AWS-LC's implementations.
  why_used: The Amazon Corretto Crypto Provider is a collection of high-performance cryptographic implementations
    exposed via standard JCA/JCE interfaces.

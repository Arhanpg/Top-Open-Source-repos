analysis:
  purpose: This GitHub action warns and then closes issues and PRs without activity after a specified amount of
    time. It improves upon [GitHub's original stale action](https://github.com/actions/stale) by allowing the action
    to run only on issues that contain a specified label, and removing labels once the issue sees new activity.

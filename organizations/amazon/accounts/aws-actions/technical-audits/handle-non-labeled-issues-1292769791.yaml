analysis:
  purpose: Issues created through the GitHub web interface can have templates applied to them, which allows maintainers
    to set a label on new issue creation. But there's no way to enforce that a label is applied to an issue when
    it is created through the API or gh CLI. LLM agents especially prefer to use the API to create issues, which
    can lead to unlabeled issues being created.

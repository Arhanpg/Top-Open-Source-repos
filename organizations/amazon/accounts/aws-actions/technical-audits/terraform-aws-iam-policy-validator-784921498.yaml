analysis:
  purpose: A GitHub Action that takes an Terraform template, parses the IAM policies attached to IAM roles, users,
    groups, and resources then runs them through IAM Access Analyzer policy validation and (optionally) custom policy
    checks. Note that a charge is associated with each custom policy check. For more details about pricing, see
    IAM Access Analyzer pricing.

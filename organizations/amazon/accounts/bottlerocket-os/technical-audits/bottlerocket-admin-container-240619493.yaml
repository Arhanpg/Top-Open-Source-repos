analysis:
  purpose: This is the admin container for troubleshooting the Bottlerocket operating system. It runs outside of
    Bottlerocket's container orchestrator in a separate instance of containerd. The container hosts an SSH server
    to allow public key SSH access, as well as agetty services for serial console devices to allow console access.
    You can also connect to the admin container via the control container by running enter-admin-container. Unless
    otherwise specified through user-data, the default user is **ec2-user**.
  why_used: A container for admin access to Bottlerocket

analysis:
  purpose: The Bottlerocket ECS Updater is a service you can install into your ECS cluster that helps you keep your
    Bottlerocket container instances up to date. When installed, the Bottlerocket ECS Updater will periodically
    query each Bottlerocket container instance to find whether an update is available and drain tasks while an update
    is in progress. Updates to Bottlerocket are rolled out in waves to reduce the impact of issues; the container
    instances in your cluster may not all see updates at the same time.
  why_used: A service to automatically manage Bottlerocket updates in an Amazon ECS cluster.

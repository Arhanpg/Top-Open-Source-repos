analysis:
  purpose: Welcome to the Content Localization on AWS project! This project will help you extend the reach of your
    VOD content by quickly and efficiently creating accurate multi-language subtitles using AWS AI Services. You
    can make manual corrections to the automatically created subtitles and use advanced AWS AI Service customization
    features to improve the results of the automation for your content domain. Content Localization is built on
    Media Insights on AWS, a framework that helps accelerate the development of serverless applications that process
    video, images, audio, and text with artificial intelligence services and multimedia services on AWS.
  why_used: Automatically generate multi-language subtitles using AWS  AI/ML services. Machine generated subtitles
    can be edited to improve accuracy and downstream tracks will automatically be regenerated based on the edits.
    Built on Media Insights Engine (https://github.com/awslabs/aws-media-insights-engine)
  core_features:
  - name: Search for filenames containing the suffix ".mp4" with, *.mp4 or filename:*.mp4
    description: Search for filenames containing the suffix ".mp4" with, *.mp4 or filename:*.mp4
    evidence:
    - 'README.md#Search Capabilities:'
  - name: 'Since Content Moderation returns a "Violence" label when it detects violence in a video, you can search
      for any video containing violence simply with: Violence'
    description: 'Since Content Moderation returns a "Violence" label when it detects violence in a video, you can
      search for any video containing violence simply with: Violence'
    evidence:
    - 'README.md#Search Capabilities:'
  - name: 'Search for videos containing violence with a 80% confidence threshold: Violence AND Confidence:>80'
    description: 'Search for videos containing violence with a 80% confidence threshold: Violence AND Confidence:>80'
    evidence:
    - 'README.md#Search Capabilities:'
  - name: 'The previous queries may match videos whose transcript contains the word "Violence". You can restrict
      your search to only Content Moderation results, like this:'
    description: 'The previous queries may match videos whose transcript contains the word "Violence". You can restrict
      your search to only Content Moderation results, like this: Operator:content_moderation AND (Name:Violence
      AND Confidence:>80)'
    evidence:
    - 'README.md#Search Capabilities:'
  - name: 'To search for Violence results in Content Moderation and guns or weapons identified by Label Detection,
      try this: (Operator:content_moderation AND Name:Violence'
    description: 'To search for Violence results in Content Moderation and guns or weapons identified by Label Detection,
      try this: (Operator:content_moderation AND Name:Violence AND Confidence:>80) OR (Operator:label_detection
      AND (Name:Gun OR Name:Weapon))'
    evidence:
    - 'README.md#Search Capabilities:'
  - name: You can search for phrases in Comprehend results like this, PhraseText:"some deep water" AND Confidence:>80
    description: You can search for phrases in Comprehend results like this, PhraseText:"some deep water" AND Confidence:>80
    evidence:
    - 'README.md#Search Capabilities:'
  - name: To see the full set of attributes that you can search for, click the Analytics menu item and search for
      "*" in the Discover tab of Kibana.
    description: To see the full set of attributes that you can search for, click the Analytics menu item and search
      for "*" in the Discover tab of Kibana.
    evidence:
    - 'README.md#Search Capabilities:'

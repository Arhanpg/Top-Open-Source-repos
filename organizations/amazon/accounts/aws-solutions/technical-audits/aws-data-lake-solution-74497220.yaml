analysis:
  purpose: Many Amazon Web Services (AWS) customers require a data storage and analytics solution that offers more
    agility and flexibility than traditional data management systems. A data lake is an increasingly popular way
    to store and analyze data because it allows businesses to store all of their data, structured and unstructured,
    in a centralized repository. The AWS Cloud provides many of the building blocks required to help businesses
    implement a secure, flexible, and cost-effective data lake.
  why_used: A deployable reference implementation intended to address pain points around conceptualizing data lake
    architectures that automatically configures the core AWS services necessary to easily tag, search, share, and
    govern specific subsets of data across a business or with other external businesses.

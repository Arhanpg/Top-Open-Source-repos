analysis:
  purpose: The Customizations for AWS Control Tower solution combines AWS Control Tower and other highly-available,
    trusted AWS services to help customers more quickly set up a secure, multi-account AWS environment based on
    AWS best practices. Customers can easily add customizations to their AWS Control Tower landing zone using an
    AWS CloudFormation template, service control policies (SCPs), and resource control policies (RCPs). Customers
    can deploy their custom template and policies to both individual accounts and organizational units (OUs) within
    their organization. Customizations for AWS Control Tower integrates with AWS Control Tower lifecycle events
    to ensure that resource deployments stay in sync with the customer's landing zone. For example, when a new account
    is created using the AWS Control Tower account factory, the solution ensures that all resources attached to

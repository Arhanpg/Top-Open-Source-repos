analysis:
  purpose: Cloud Migration Factory on AWS is an AWS Solutions Implementation that helps migrate a large number of
    servers with CloudEndure Migration in a simplified and expedited way at scale. The solution automates many of
    the manual, time-consuming tasks that enterprises commonly face in migrating servers from on-premise to the
    cloud; for example, checking prerequisites on the source machine, installing/uninstalling software on the source
    and target machine. Thousands of servers have been migrated to AWS using this solution. When customers deploy
    the solution, its AWS CloudFormation template automatically provisions and configures the necessary AWS services.
  why_used: The Cloud Migration Factory on AWS solution is designed to coordinate and automate manual processes
    for large-scale migrations. This solution helps enterprises improve performance and prevents long cutover windows
    by providing an orchestration platform for migrating workloads to AWS at scale.

analysis:
  purpose: DeepRacer on AWS is a solution that allows you to train and evaluate reinforcement learning models in
    a three-dimensional simulated autonomous-driving environment. The trained model can then be downloaded to a
    AWS DeepRacer vehicle (a 1/18th scale RC car capable of running inference on a trained AWS DeepRacer model for
    autonomous driving) so it can drive in a physical environment. You can also submit your model to a virtual race
    and have its performance ranked against other models in a virtual leaderboard.
  why_used: DeepRacer on AWS is the latest evolution of AWS DeepRacer, delivering a self-hosted reinforcement learning
    solution you can deploy to your AWS account to train and evaluate autonomous-driving models in a 3D simulated
    environment.

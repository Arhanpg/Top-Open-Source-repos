analysis:
  purpose: This solution enables users to upload first party datasets from Amazon S3 into the Amazon Marketing Cloud
    (AMC). It includes a web application in which users are guided through the process of defining datasets and
    their PII attributes. Once this information is submitted, the solution initiates an ETL workflow that performs
    data normalization, hashing of plain-text PII, time-series partitioning, and upload to AMC.
  why_used: Easily upload first-party signals into Amazon Marketing Cloud (AMC) for evaluating and planning advertising
    campaigns

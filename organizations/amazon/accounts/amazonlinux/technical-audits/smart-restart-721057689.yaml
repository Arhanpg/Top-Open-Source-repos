analysis:
  purpose: This package restarts systemd services on system updates every time a package is updated (installed or
    deleted) using the systems package mamanger (every time dnf {update, upgrade, downgrade} is executed). It primarily
    is tailored for Amazon Linux 2023 but easily can be ported to all RPM based systems like Fedora. Smart-Restart
    utilizes the needs-restarting package from dnf-utils and a custom denylisting mechanism to determine which services
    need to be restarted and how to determine if a system reboot is advices. In case a system reboot is advised,
    a reboot hint marker file is generated (/run/smart-restart/reboot-hint-marker) containing the services and other
    components which require a restart.

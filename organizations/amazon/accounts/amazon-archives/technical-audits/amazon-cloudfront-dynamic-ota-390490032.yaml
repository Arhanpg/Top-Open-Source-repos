analysis:
  purpose: A common pattern for IoT devices is for updates to be pushed over the air. However, in some cases, it
    may not be possible to control updates to a device. This is especially true in the case of "anonymous" devices
    that are unregistered with a backend system, such as AWS IoT. It may also be cost prohibitive to try to manage
    updates to large fleets of devices, where a fire-and-forget strategy might be better suited.
  why_used: A solution for providing over the air updates to devices regardless of authentication status with packages
    generated dynamically based on query params in the request and ETags in the header.

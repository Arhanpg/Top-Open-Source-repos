analysis:
  purpose: '**Anomaly detection systems** (i.e. Amazon Macie) often perform quantitative analytics over timeseries
    derived from activities on their monitored subjects. While the core anomaly detection algorithms can be tested
    in isolation using test vectors, testing and measuring end to end performance and accuracy of these systems
    remain a challenge. **activity generator** aims to address at least a subset of these challenges via providing
    a platform to facilitate **timeseries generation, noise addition, anomaly injection** and **execution on target
    subjects** over an extended period of time. This platform offers generating synthetic timeseries as well as
    replaying real timeseries gathered from monitoring subjects in the past.'
  why_used: A platform to help security researchers develop and test machine learning-based security services based
    on time-series data, with the ability to generate synthetic time-series, replay existing log time-series, and
    inject noise and anomalies.

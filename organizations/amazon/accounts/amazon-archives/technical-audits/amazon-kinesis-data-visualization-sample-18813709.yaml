analysis:
  purpose: The **Amazon Kinesis Data Visualization Sample Application** demonstrates how to interact with [Amazon
    Kinesis][kinesis] to generate meaningful statistics from a stream of data and visualize those results in real
    time.
  why_used: Amazon Kinesis Data Visualization Sample Application
  core_features:
  - name: A record publisher to send data to [Amazon Kinesis][kinesis].
    description: A record publisher to send data to [Amazon Kinesis][kinesis].
    evidence:
    - README.md#Features
  - name: An [Amazon Kinesis Client][kcl] application to compute the number of HTTP requests a resource received,
      and the HTTP referrer that sent them, over a sliding win
    description: An [Amazon Kinesis Client][kcl] application to compute the number of HTTP requests a resource received,
      and the HTTP referrer that sent them, over a sliding window.
    evidence:
    - README.md#Features

analysis:
  purpose: The **Amazon Kinesis Connector Library** helps Java developers integrate [Amazon Kinesis][aws-kinesis]
    with other AWS and non-AWS services. The current version of the library provides connectors for [Amazon DynamoDB][aws-dynamodb],
    [Amazon Redshift][aws-redshift], [Amazon S3][aws-s3], [Elasticsearch][Elasticsearch]. The library also includes
    sample connectors of each type, plus Apache Ant build files for running the samples.

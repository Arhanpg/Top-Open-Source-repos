analysis:
  purpose: This code demonstrates the architecture featured on the AWS big data blog (https://aws.amazon.com/blogs/big-data/)
    on creating a healthcare data warehouse using Redshift, Spark on EMR and Lambda that was published on May 12,
    2017. It takes an openly available research dataset called MIMIC-III and converts it into a standard open source
    healthcare data model called OMOP.
  why_used: Demonstrates creating a healthcare data warehouse using the MIMIC-III dataset on Redshift, Spark on
    EMR and Lambda

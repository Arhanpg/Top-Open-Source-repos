analysis:
  purpose: A data-stream processing framework written in Rust that enables complex data transformations through
    composable processors connected via a bash-like graph-based workflow language. This work includes options to
    leverage Amazon AWS services and can serve as a reference implementation of Rust integration.
  why_used: A lightweight, command-line data-stream processing framework written in Rust
  core_features:
  - name: '**Processing Graph Architecture**: Build complex DAGs using variables for branching and merging of data
      streams'
    description: '**Processing Graph Architecture**: Build complex DAGs using variables for branching and merging
      of data streams'
    evidence:
    - README.md#Features
  - name: '**Stream Processing**: Low latency, event-at-a-time processing as well as batch-events at a time processing'
    description: '**Stream Processing**: Low latency, event-at-a-time processing as well as batch-events at a time
      processing'
    evidence:
    - README.md#Features
  - name: '**Multiple Input Sources**: JSON files, CSV, S3 objects, SQS queues, Kinesis streams, Athena queries'

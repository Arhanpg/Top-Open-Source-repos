  - name: '**Modular Components**: Accelerate GenAI adoption with secure, scalable software. LISA supports various
      use cases through configurable components: model serving'
    description: '**Modular Components**: Accelerate GenAI adoption with secure, scalable software. LISA supports
      various use cases through configurable components: model serving and orchestration, chat user interface with
      advanced capabilities, authentication, retrieval augmented generation (RAG), Anthropic’s Model Context Protocol
      (MCP), and APIs.'
    evidence:

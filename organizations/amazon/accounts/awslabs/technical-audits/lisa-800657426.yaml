analysis:
  purpose: Our large language model (LLM) inference solution for the Amazon Dedicated Cloud (ADC), LISA, is open
    source infrastructure-as-code. Customers deploy it directly into an Amazon Web Services (AWS) account in any
    region. LISA is modular, scalable, and ready to support production use cases.
  why_used: LLM inference solution for Amazon Dedicated Cloud (LISA).

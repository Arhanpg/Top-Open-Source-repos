analysis:
  purpose: The Infrastructure Document Generator is an intelligent automation tool that revolutionizes AWS infrastructure
    documentation and analysis. By automatically scanning cloud environments, it creates comprehensive, real-time
    documentation with detailed configuration reports, including dependency maps of resources based on access policies.
    The tool goes beyond basic documentation by providing actionable insights based on AWS Well-Architected Framework
    principles, providing reports on Security Best Practices, Comprehensive Analysis and Performance Improvement,
    enabling organizations to optimize their cloud infrastructure while maintaining accurate documentation with
    minimal effort.

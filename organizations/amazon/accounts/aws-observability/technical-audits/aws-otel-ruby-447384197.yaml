analysis:
  purpose: This repo hosts documentation and sample apps for the ADOT Ruby library which provides the AWS service
    integrations for traces and metrics for the OpenTelemetry Ruby library. The library can be configured to support
    trace applications with the AWS X-Ray service. This way, traces generated by OpenTelemetry Ruby can be queried
    in the AWS X-Ray console where users can see information such as the duration, method invoked, status codes,
    and more.

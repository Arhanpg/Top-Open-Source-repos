analysis:
  purpose: The CloudWatch RUM web client is a JavaScript library that performs real user monitoring (RUM) on web
    applications. It captures page load timing, web vitals (LCP, FID, CLS, INP), JavaScript errors, HTTP requests,
    session replays, and custom events, then ships them to Amazon CloudWatch RUM.

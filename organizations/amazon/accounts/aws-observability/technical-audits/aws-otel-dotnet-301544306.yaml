analysis:
  purpose: This repo hosts documentation and sample apps for the ADOT .NET library which provides the AWS service
    integrations for traces and metrics for the OpenTelemetry .NET library. The library can be configured to support
    trace applications with the AWS X-Ray service. This way, all the features of the OpenTelemetry project are available,
    but its components are configured to create traces which can be viewed in the AWS X-Ray console and are configured
    to allow propagation of those contexts across multiple downstream AWS services.
  why_used: AWS Distro for OpenTelemetry .NET

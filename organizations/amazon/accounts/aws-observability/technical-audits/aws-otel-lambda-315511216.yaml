analysis:
  purpose: As a downstream Repo of opentelemetry-lambda, ___aws-otel-lambda___ publishes AWS managed OpenTelemetry
    Lambda layers that are preconfigured for use with AWS services and bundle the reduced ADOT Collector. Users
    can onboard to OpenTelemetry in their existing Lambda functions by adding these ready-made layers directly.
  why_used: AWS Distro for OpenTelemetry - AWS Lambda

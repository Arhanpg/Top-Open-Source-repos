  limitations:
  - '1.2.2 platforms: platforms are the platforms the test case will be running on. We require all the platforms
    to be listed unless you have a special reason to skip some of the platforms. An example for otlp_http_exporter_trace_mock
    Below are the platforms:'
  - '1.2.2 platforms: * LOCAL, which will run the test in the pr workflow, the test will be directly running on
    the github workflow vm.'
  - '1.2.2 platforms: * EC2, which will run the test in the main branch workflow under an ec2 instance.'
  - '1.2.2 platforms: * ECS, which will run the test in the main branch workflow under an ecs cluster.'
  - '1.2.2 platforms: * EKS, which will run the test in the main branch workflow under an eks/k8s cluster.'
  - '1.2.2 platforms: * SOAKING, which will run every night, and perform high throughput to your test case and monitor
    the resource usages.'
  - '1.2.2 platforms: * NEG_SOAKING, which will run every night, and perform high throughput to your test case with
    false endpoint and monitor the resource usages.'
  - '1.2.2 platforms: * CANARY, which will run hourly, and test against the latest released version of aoc.'

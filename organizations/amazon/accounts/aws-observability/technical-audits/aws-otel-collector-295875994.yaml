analysis:
  purpose: AWS Distro for OpenTelemetry Collector (ADOT Collector) is an AWS supported version of the upstream OpenTelemetry
    Collector and is distributed by Amazon. It supports the selected components from the OpenTelemetry community.
    It is fully compatible with AWS computing platforms including EC2, ECS, and EKS. It enables users to send telemetry
    data to AWS CloudWatch Metrics, Traces, and Logs backends as well as the other supported backends.

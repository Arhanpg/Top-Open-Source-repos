analysis:
  purpose: This project is a redistribution of the OpenTelemetry Auto-Instrumentation for NodeJS, preconfigured
    for use with AWS services. Please check out that project too to get a better understanding of the underlying
    internals. You won't see much code in this repository since we only apply some small configuration changes,
    and our OpenTelemetry friends takes care of the rest. The exception to this is support for Application Signals.

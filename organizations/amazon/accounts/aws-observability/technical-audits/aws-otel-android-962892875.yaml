analysis:
  purpose: 'This repo contains the AWS Distro for OpenTelemetry (ADOT) on Android. It is a bundle that ships a few
    things out of the box: 1. OpenTelemetry Java SDK (https://github.com/open-telemetry/opentelemetry-java) 2. OpenTelemetry
    Android automated instrumentation (https://github.com/open-telemetry/opentelemetry-android) 4. Additional automated
    instrumentation not currently part of upstream OpenTelemetry Android, like the "Time to first draw" telemetry
    5. AWS-specific exporter and auth configuration that works out of the box when exporting telemetry to AWS CloudWatch
    Real User Monitoring (RUM)'
  why_used: 'This repo contains the AWS Distro for OpenTelemetry (ADOT) on Android. It is a bundle that ships a
    few things out of the box: 1. OpenTelemetry Java SDK (https://github.com/open-telemetry/opentelemetry-java)
    2. OpenTelemetry Android automated instrumentation (https://github.com/open-telemetry/opentelemetry-android)
    4. Additional automated instrumentation not currently part of upstream OpenTelemetry Android, like the "Time
    to first draw" telemetry 5. AWS-specific exporter and auth configuration that works out of the box when exporting
    telemetry to AWS CloudWatch Real User Monitoring (RUM)'

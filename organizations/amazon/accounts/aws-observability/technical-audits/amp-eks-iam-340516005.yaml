analysis:
  purpose: amp-eks-iam creates an IAM role to give remote write privileges to an EKS service account. If you are
    collecting Prometheus metrics on EKS and want to send them to [Amazon Managed Service for Prometheus (AMP)](https://aws.amazon.com/prometheus/),
    you can use this tool to give minimal privileges to your Kubernetes namespace and service account.
  why_used: Tool providing easy IAM setup on EKS for Amazon Managed Service for Prometheus (AMP) users.

analysis:
  purpose: This repo hosts documentation and sample apps for the ADOT Python library which provides the AWS service
    integrations for traces and metrics for the OpenTelemetry Python library. The library can be configured to support
    trace applications with the AWS X-Ray service. This enables all the features of the OpenTelemetry project and
    configures its components to create traces that can be viewed in the AWS X-Ray console and allow propagation
    of those contexts across multiple downstream AWS services.
  why_used: AWS Distro for OpenTelemetry Python

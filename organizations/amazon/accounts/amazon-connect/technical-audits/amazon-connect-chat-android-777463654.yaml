analysis:
  purpose: The Amazon Connect Chat SDK for Android is a Kotlin library that gives you the power to easily integrate
    Amazon Connect Chat directly into your native Android applications. The Amazon Connect Chat SDK helps handle
    client side chat logic and back-end communications similar to the Amazon Connect ChatJS Library. The SDK wraps
    the Amazon Connect Participant Service APIs and abstracts away the management of the chat session and WebSocket.
    This allows you to focus on the user interface and experience while relying on the Amazon Connect Chat SDK to
    interact with all the back-end services. This approach still requires using your own chat back end to call the
    Amazon Connect StartChatContact API to initiate contact. You can read instructions on how to quickly set up
    a StartChatContact Lambda from our startChatContactAPI example.

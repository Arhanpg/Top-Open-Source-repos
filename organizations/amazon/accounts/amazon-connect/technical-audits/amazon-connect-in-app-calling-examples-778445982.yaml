analysis:
  purpose: 'Amazon Connect''s out of the box communication widget and agent workspace allow you to add in-app, web,
    and video calling capabilities to your website or mobile application with a few lines of code. This repository
    contains examples of: 1) how to create multi-user web and video calling experiences, 2) how to integrate in-app
    calling into iOS and Android applications, 3) an example backend that works with these iOS and Android mobile
    samples, and 4) while web calling works out of the box with custom CCPs for voice call, we show to integrate
    video calling into an custom CCP.'
  why_used: 'Amazon Connect''s out of the box communication widget and agent workspace allow you to add in-app,
    web, and video calling capabilities to your website or mobile application with a few lines of code. This repository
    contains examples of: 1) how to create multi-user web and video calling experiences, 2) how to integrate in-app
    calling into iOS and Android applications, 3) an example backend that works with these iOS and Android mobile
    samples, and 4) while web calling works out of the box with custom CCPs for voice call, we show to integrate
    video calling into an custom CCP.'

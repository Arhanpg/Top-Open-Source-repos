analysis:
  purpose: 'The Amazon Connect Streams API (Streams) gives you the power to integrate your existing web applications
    with Amazon Connect. Streams lets you embed the Contact Control Panel (CCP) and Customer Profiles app UI into
    your page. It also enables you to handle agent and contact state events directly through an object oriented
    event driven interface. You can use the built in interface or build your own from scratch: Streams gives you
    the choice.'

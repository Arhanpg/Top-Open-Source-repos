analysis:
  purpose: FreeRTOS-Plus-TCP is a lightweight TCP/IP stack for FreeRTOS. It provides a familiar Berkeley sockets
    interface, making it as simple to use and learn as possible. FreeRTOS-Plus-TCP's features and RAM footprint
    are fully scalable, making FreeRTOS-Plus-TCP equally applicable to smaller lower throughput microcontrollers
    as well as larger higher throughput microprocessors.

  setup_and_usage:
  - 'Getting Started: First, clone the aws-controllers-k8s/controller-bootstrap repository and run the following
    script in the controller-bootstrap.'
  - 'Getting Started: export SERVICE=${AWS_SERVICE_NAME}'
  - 'Getting Started: For a new ACK service controller, the make command bootstraps an ACK service controller repository.
    For an existing ACK service controller, it updates the service controller repository with the latest templates
    of the project description files.'
  - 'Getting Started: To generate the common directories and files for a new ACK service controller using CLI command,
    the user can run the generate command from the controller-bootstrap.'
  - 'Getting Started: controller-bootstrap generate --aws-service-alias ${AWS_SERVICE} --ack-runtime-version ${ACK_RUNTIME_VERSION}'
  - 'Getting Started: --aws-sdk-go-version ${AWS_SDK_GO_VERSION} --dry-run=${DRY_RUN} --output-path ${CONTROLLER_DIR}'

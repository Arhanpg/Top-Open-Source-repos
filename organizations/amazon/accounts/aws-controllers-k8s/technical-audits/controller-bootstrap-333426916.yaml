analysis:
  purpose: 'The ACK controller-bootstrap tool automates the repository bootstrap process for new ACK service controllers
    in the aws-controller-k8s Github organization. For existing ACK service controllers, this tool will update the
    service controllers with the latest templates of the project description files, which include: CODE_OF_CONDUCT.md,
    CONTRIBUTING.md, GOVERNANCE.md, LICENSE, NOTICE, SECURITY.md files.'

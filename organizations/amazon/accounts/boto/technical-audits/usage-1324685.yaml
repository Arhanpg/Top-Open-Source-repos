analysis:
  purpose: 'usage provides some basic tools to parse XML usage reports from Amazone Web Services. These reports
    contain detailed information about resources that you are using (and therefore will be billed for) for a given
    AWS account. There is no API available to download these usage reports from your AWS web console so you either
    have to download them manually or use a screen scraping approach as described here:'

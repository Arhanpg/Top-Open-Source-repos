analysis:
  purpose: DLR is a compact, common runtime for deep learning models and decision tree models compiled by AWS SageMaker
    Neo, TVM, or Treelite. DLR uses the TVM runtime, Treelite runtime, NVIDIA TensorRT™, and can include other hardware-specific
    runtimes. DLR provides unified Python/C++ APIs for loading and running compiled models on various devices. DLR
    currently supports platforms from Intel, NVIDIA, and ARM, with support for Xilinx, Cadence, and Qualcomm coming
    soon.
  why_used: Neo-AI-DLR is a common runtime for machine learning models compiled by AWS SageMaker Neo, TVM, or TreeLite.

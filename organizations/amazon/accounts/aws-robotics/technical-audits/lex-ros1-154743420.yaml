analysis:
  purpose: The ROS lex_node node enables a robot to comprehend natural language commands by voice or textual input
    and respond through a set of actions, which an AWS Lex Bot maps to ROS messages. Out of the box this node provides
    a ROS interface to communicate with a specified Amazon Lex bot (configured via lex_config.yaml) and requires
    configuration of AWS credentials. The Amazon Lex bot needs to be defined with responses and slots for customer
    prompts. A set of default slots and mappings are demonstrated in the [sample app] and include actions as “Create
    ,” “Go to ” and “Stop.” Additional guides on configuring bots with are available at [Getting Started with Amazon
    Lex].
  why_used: ROS packages for facilitating the use of AWS cloud services.

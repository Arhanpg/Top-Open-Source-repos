analysis:
  purpose: The **cloudwatch_logger** node enables logs generated in a ROS system to get sent to AWS CloudWatch Logs.
    Out of the box, this node provides the ability to subscribe to the **/rosout_agg** (rosout aggregated) topic,
    which all logs using the ROS logging framework will be published to, and sends logs to the AWS CloudWatch Logs
    service. Logs can be sent to AWS CloudWatch Logs selectively based on log severity. The **cloudwatch_logger**
    node can also subscribe to other topics if logs are not sent to **/rosout_agg**, and it is able to unsubscribe
    to the rosout_agg topic for getting logs.
  why_used: ROS packages for facilitating the use of AWS cloud services.

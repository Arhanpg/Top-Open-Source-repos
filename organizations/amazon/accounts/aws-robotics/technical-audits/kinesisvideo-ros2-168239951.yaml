analysis:
  purpose: The Kinesis Video Streams ROS package enables robots to stream video to the cloud for analytics, playback,
    and archival use. Out of the box, the nodes provided make it possible to encode & stream image data (e.g. video
    feeds and LIDAR scans) from a ROS “Image” topic to the cloud, enabling you to view the live video feed through
    the Kinesis Video Console, consume the stream via other applications, or perform intelligent analysis, face
    detection and face recognition using Amazon Rekognition.
  why_used: ROS packages for facilitating the use of AWS cloud services.

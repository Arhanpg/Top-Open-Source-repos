analysis:
  purpose: The cloudwatch_metrics_collector ROS Node publishes your robot's metrics to the cloud to enable you to
    easily track the health of a fleet with the use of automated monitoring and actions for when a robot's metrics
    show abnormalities. You can easily track historic trends and profile behavior such as resource usage. Out of
    the box it provides a ROS interface to take a ROS message defining a metric and publish it to Amazon CloudWatch
    Metrics. The only configuration required to get started is setting up AWS Credentials and Permissions for your
    robot.The CloudWatch Metrics Node can be used with existing ROS Nodes that publish metric messages or with your
    own nodes if you instrument them to publish your own custom metrics.
  why_used: ROS packages for facilitating the use of AWS cloud services.

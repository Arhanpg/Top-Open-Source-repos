analysis:
  purpose: 1. In China CloudFront SSL Plugin V1, each stack can only manage one project (i.e., one domain name collection).
    To manage multiple domain name collections, multiple stacks need to be deployed. In contrast, the stack of China
    CloudFront SSL Plugin V2 can manage multiple projects (i.e., multiple domain name collections). 2. The certificate
    management interface of the first version of the China CloudFront SSL plugin is an API management page built

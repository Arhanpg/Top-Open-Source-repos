analysis:
  purpose: Many Organizations are running Oracle E-Business Suite, which in most cases is considered a core application
    within the organization. Oracle E-Business Suite is a business application suite that includes financial, supply
    chain, human resources, and customer relationship management modules. Due to the application’s critical nature,
    It is imperative to architect Oracle E-Business Suite for high availability and to develop the ability to switchover
    the application and database as quickly as possible by removing personal dependencies. It is critical for organizations
    to ensure high availability of Oracle E-Business Suite applications in order to minimize downtime and maintain
    business continuity. One method for achieving high availability is to perform an EBS application switchover.
    This document will go over how to perform an Oracle E-Business Suite application and database switchover.
  why_used: Oracle E-Business Suite DR Switchover

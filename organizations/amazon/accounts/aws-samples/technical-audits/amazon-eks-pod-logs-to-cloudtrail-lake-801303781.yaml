analysis:
  purpose: Customers often look for options to capture and centralized storage of application logs from [Amazon
    Elastic Kubernetes Service on Fargate](https://docs.aws.amazon.com/eks/latest/userguide/fargate.html) (Amazon
    EKS on Fargate) Pods to investigate root causes or analyze security incidents. Customers also like the capability
    to easily query the logs to assist with security investigations. In this blog post, we show you how to ingest
    the Amazon EKS Pod logs into [AWS CloudTrail Lake](https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-lake.html)
    for long-term storage and analytics.

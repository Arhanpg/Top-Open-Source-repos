analysis:
  purpose: Keeping an up-to-date asset inventory with real devices deployed in the field can be a challenging and
    time-consuming task. Many electricity providers use manufacturer\'s labels as key information to link their
    physical assets within asset inventory systems. Computer vision appears to be a viable solution to speed up
    operator inspections and reduce human errors by automatically extracting relevant data from the label. However,
    building a standard computer vision application capable of managing hundreds of different types of labels can
    be a complex and time-consuming endeavor. This solution, leveraging generative artificial intelligence and [large
    language models (LLMs)](https://aws.amazon.com/what-is/large-language-model/), aims to alleviate the time-consuming
    and labor-intensive tasks required to build a computer vision application, enabling you to immediately start
    taking pictures of y

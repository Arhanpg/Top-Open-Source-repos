analysis:
  purpose: CASE, the mega-trend keyword for the automotive industry, can be summarized as Connectivity, Autonomous,
    Sharing, and Electrification. Among them, connectivity is the foundation that enables cars that are integrated
    with IT technology to develop into living spaces that are connected to the world and move, and to provide various
    mobility services. As the number of connected vehicles in mobility services increases rapidly, fleet management
    systems (FMS) need to be configured to meet various needs. In this post, we'll share how 42dot addressed these
    challenges with AWS IoT Core and AWS CDK.

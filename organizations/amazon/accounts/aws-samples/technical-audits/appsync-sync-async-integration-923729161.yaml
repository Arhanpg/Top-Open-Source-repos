analysis:
  purpose: This is a demo application that consists of an API converting a synchronous request coming from the client
    into an asynchronous request to the backend using AppSync Events. In order to simulate an asynchronous backend
    processing, we are using an asynchronous AWS Step Functions workflow, which receives an event with Name and
    Surname as input, waits 10 seconds and then posts an event with the full name at the AppSync Event channel.
    While the asynchrnous procesing is execute, the synchronous API subscribes to the AppSync channel in order to
    be notified when the event arrives there.

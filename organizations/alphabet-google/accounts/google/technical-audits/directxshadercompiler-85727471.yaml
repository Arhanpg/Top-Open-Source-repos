analysis:
  purpose: The DirectX Shader Compiler project includes a compiler and related tools used to compile High-Level
    Shader Language (HLSL) programs into DirectX Intermediate Language (DXIL) representation. Applications that
    make use of DirectX for graphics, games, and computation can use it to generate shader programs.
  why_used: This repo hosts the source for the DirectX Shader Compiler which is based on LLVM/Clang.

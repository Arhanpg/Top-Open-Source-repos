analysis:
  purpose: This R package implements an approach to estimating the causal effect of a designed intervention on a
    time series. For example, how many additional daily clicks were generated by an advertising campaign? Answering
    a question like this can be difficult when a randomized experiment is not available. The package aims to address
    this difficulty using a structural Bayesian time-series model to estimate how the response metric might have
    evolved after the intervention if the intervention had not occurred.

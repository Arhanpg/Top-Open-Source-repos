analysis:
  purpose: To help people with disabilities access Android apps, developers of those apps need to consider how their
    apps will be presented to accessibility services. Some good practices can be checked by automated tools, such
    as if a View has a contentDescription. Other rules require human judgment, such as whether or not a contentDescription
    makes sense to all users.

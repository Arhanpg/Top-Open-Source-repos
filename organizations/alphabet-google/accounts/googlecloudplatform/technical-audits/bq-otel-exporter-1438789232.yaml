  limitations:
  - 'Known limitations and misuse: - **Exactly-once.** See delivery semantics above.'
  - 'Known limitations and misuse: - **In-exporter aggregation or sampling.** Use the Collector''s processors for
    pre-export aggregation or sampling; the companion rollup views (v_gen_ai_model_costs, v_gen_ai_sessions, v_gen_ai_tool_usage)
    are SQL views in BigQuery.'
  - 'Known limitations and misuse: - **GCS batch LOAD inside bigqueryexporter.** Storage Write API is the single
    export path (one schema, one exporter); stock OTel googlecloudstorageexporter + cron bq load cannot satisfy
    the flattened row, insert_id, intra-batch ordinal, or object_refs contracts, and shared-pool LOAD has no SLA
    under BigQuery''s 1,500 jobs/table/day limit (including '
  - 'Known limitations and misuse: Operational limits and common misuse:'
  - 'Known limitations and misuse: - **At-least-once delivery and _dedup views.** Appends go through Storage Write
    API default streams (AppendRows), so transient retries or uncertain acknowledgements can leave duplicate rows
    in otel_spans, otel_logs, or otel_metrics. Read the companion _dedup views (otel_spans_dedup, otel_logs_dedup,
    otel_metrics_dedup) whenever query correctness re'
  - 'Known limitations and misuse: - **Persistent-queue crash replays.** When sending_queue.storage is enabled,
    unacknowledged batches replayed from disk after a Collector crash or unclean shutdown can produce duplicates
    outside the in-process uncertain-ack duplicate bound because batches already committed on the server may be
    re-read before the queue cursor advances.'
  - 'Known limitations and misuse: - **Structural rejections drop rows unless quarantine is enabled.** Records rejected
    by limits.* bounds (limits.max_attribute_count, limits.max_event_count, limits.max_link_count, limits.max_nesting_depth,
    limits.max_collection_size, limits.max_attribute_key_bytes, limits.max_value_bytes), serialized row-size bounds
    (write.max_row_bytes), or server'
  - 'Known limitations and misuse: - **Storage Write API quotas, write.stream_pool_size, and BACKGROUND slots.**
    write.stream_pool_size (1..16, default 1, experimental) opens N default-stream writers per destination signal
    table (otel_spans, otel_logs, otel_metrics), and quarantine.enabled: true opens a separate client and stream
    for quarantine.table. Increasing write.stream_pool_si'

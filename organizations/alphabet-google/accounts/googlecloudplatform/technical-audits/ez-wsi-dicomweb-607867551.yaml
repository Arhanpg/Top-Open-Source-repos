analysis:
  purpose: EZ WSI DicomWeb is a python library that provides the ability to effortlessly extract an image patch
    from a pathology DICOM whole slide image (WSI) stored in a cloud DICOM store. This functionality is useful for
    different pathology workflows, especially those leveraging AI. EZ-WSI provides interfaces to enable embeddings
    to be easily generated from Digital Pathology patches and images.

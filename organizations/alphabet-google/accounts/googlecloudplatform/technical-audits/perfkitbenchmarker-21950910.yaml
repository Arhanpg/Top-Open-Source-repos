analysis:
  purpose: PerfKit Benchmarker is an open effort to define a canonical set of benchmarks to measure and compare
    cloud offerings. It's designed to operate via vendor provided command line tools. The benchmark default settings
    are not tuned for any particular platform or instance type. These settings are recommended for consistency across
    services. Only in the rare case where there is a common practice like setting the buffer pool size of a database
    do we change any settings.
  why_used: PerfKit Benchmarker (PKB) contains a set of benchmarks to measure and compare cloud offerings. The benchmarks
    use default settings to reflect what most users will see. PerfKit Benchmarker is licensed under the Apache 2
    license terms. Please make sure to read, understand and agree to the terms of the LICENSE and CONTRIBUTING files
    before proceeding.

analysis:
  purpose: Data Pipeline is a self-hosted [Google App Engine] sample application that enables its users to easily
    define and execute data flows across different [Google Cloud Platform] products. It is intended as a reference
    for connecting multiple cloud services together, and as a head start for building custom data processing solutions.
  why_used: Data pipeline is a tool to run Data loading pipelines. It is an open sourced app engine app that users
    can extend to suit their own needs. Out of the box it will load files from a source, transform them and then
    output them (output might be writing to a file or loading them into a data analysis tool). It is designed to
    be modular and support various sources, transformation technologies and output types. The transformations can
    be chained together to form complex pipelines.

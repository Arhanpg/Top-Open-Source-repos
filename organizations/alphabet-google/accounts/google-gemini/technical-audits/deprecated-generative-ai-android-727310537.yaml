analysis:
  purpose: With Gemini 2.0, we took the chance to create a unified SDK for mobile developers who want to use Google's
    GenAI models (Gemini, Veo, Imagen, etc). As part of that process, we took all of the feedback from this SDK
    and what developers like about other SDKs in the ecosystem to directly work with the Firebase SDK. We don't
    plan to add anything to this SDK or making any further changes. We know how disruptive an SDK change can be
    and don't take this change lightly, but our goal is to create an extremely simple and clear path for developers
    to build with our models so it felt necessary to make this change.
  why_used: This SDK is now deprecated, use the unified Firebase SDK.

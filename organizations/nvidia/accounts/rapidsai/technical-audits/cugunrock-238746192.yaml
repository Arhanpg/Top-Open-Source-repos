analysis:
  purpose: '**Gunrock** is a CUDA library for graph-processing designed specifically for the GPU. It uses a **high-level**,
    **bulk-synchronous**, **data-centric abstraction** focused on operations on vertex or edge frontiers. Gunrock
    achieves a balance between performance and expressiveness by coupling high-performance GPU computing primitives
    and optimization strategies, particularly in the area of fine-grained load balancing, with a high-level programming
    model that allows programmers to quickly develop new graph primitives that scale from one to many GPUs on a
    node with small code size and minimal GPU programming knowledge. For more details, see Gunrock''s Overview.'
  why_used: '**Gunrock** is a CUDA library for graph-processing designed specifically for the GPU. It uses a **high-level**,

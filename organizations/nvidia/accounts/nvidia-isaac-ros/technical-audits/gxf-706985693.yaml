analysis:
  purpose: GXF is a framework from NVIDIA that provides a component-based architecture designed for developing hardware
    accelerated compute graphs. The framework is at the foundation of other high-performance SDKs such as NVIDIA
    Holoscan, DeepStream, and Isaac ROS. For example, NITROS (NVIDIA Isaac Transport for ROS) leverages GXF compute
    graphs embedded within ROS 2 nodes with optimized transport between them to achieve highly efficient ROS application
    graphs.

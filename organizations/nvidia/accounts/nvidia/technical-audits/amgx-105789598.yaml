analysis:
  purpose: AmgX is a GPU accelerated core solver library that speeds up computationally intense linear solver portion
    of simulations. The library includes a flexible solver composition system that allows a user to easily construct
    complex nested solvers and preconditioners. The library is well suited for implicit unstructured methods. The
    AmgX library offers optimized methods for massive parallelism, the flexibility to choose how the solvers are
    constructed, and is accessible through a simple C API that abstracts the parallelism and scale across a single
    or multiple GPUs using user provided MPI.
  why_used: Distributed multigrid linear solver library on GPU

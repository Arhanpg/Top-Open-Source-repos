analysis:
  purpose: '1. We use Theseus optimizers for pose optimization to replace BundleFusion. 2. Add optional config for
    color fusion across views to handle varying lighting conditions. (See Configuration for usage) 3. We now use
    commercial version FoundationStereo ONNX weight from NVIDIA TAO Toolkit. Now could be enabled through FoundationStereo
    configuration. 4. Add multi-architecture Docker support with automatic detection: deployment now automatically
    detects x86_64 vs ARM64 (tested on Jetson Orin) and uses the appropriate Dockerfile (Dockerfile or Dockerfile.aarch64)
    and upgrade to pytorch 2.7.0 for better compatiblity especially for newer architechures. 5. Add USD Exporting,
    Now we will export USD and USDZ of the reconstructed object for further usage.'
  why_used: 3D Object Reconstruction project is a workflow that takes a set of stereo images and camera info and

analysis:
  purpose: Snapshot is a Kubernetes-native checkpoint and restore system for NVIDIA GPU workloads. It checkpoints
    a fully initialized GPU pod (its running process, with CPU and GPU memory) and restores that state on any compatible
    node, so a pod becomes ready in seconds instead of minutes.
  why_used: Snapshot gets GPU pods ready in seconds instead of minutes — by restoring a fully initialized GPU worker
    instead of starting one from scratch. Kubernetes-native checkpoint & restore that runs alongside your existing
    stack.

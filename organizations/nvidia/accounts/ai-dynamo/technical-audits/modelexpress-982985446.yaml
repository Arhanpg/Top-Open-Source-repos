  setup_and_usage:
  - 'Quick Start: This Quick Start sets up the P2P path, which is what the benchmarks above measure, so it needs
    the full NIXL and metadata-backend prerequisites listed below. For a local single-machine setup instead, docker
    compose -f docker/docker-compose.yml up --build brings up the server with a Redis backend and no NIXL, and the
    modelexpress-cli commands in CLI'
  - 'Quick Start: **Requirements:** vLLM 0.23.0+, the ModelExpress Python package, NIXL-compatible GPU nodes, and
    a reachable metadata backend.'
  - 'Quick Start: git clone https://github.com/ai-dynamo/modelexpress.git'
  - 'Quick Start: python -m pip install ./modelexpress_client/python'
  - 'Quick Start: export MX_SERVER_ADDRESS=modelexpress-server:8001'
  - 'Quick Start: export MX_P2P_METADATA=1'
  - 'Quick Start: export MX_ARTIFACT_TRANSFER=1'
  - 'Quick Start: export MX_ARTIFACT_BACKEND=nixl'
  limitations:
  - 'Known Issues: - **GDS loader does not scale with TP** — Each TP rank reads full checkpoint tensors and vLLM
    shards them afterward, so GDS/disk reads scale with TP degree. This can reduce or reverse expected GDS speedups
    versus the default mmap-based disk loader; TP-aware range reads are needed for a full fix. See GDS Reads Full
    Checkpoint Tensors Under TP.'
  - 'Known Issues: - **P2P source wedges after a reader is torn down (UCX/InfiniBand)** — Once a reader that pulled
    from a source is removed, the source can stop serving new readers: their RDMA reads stall to the transfer timeout
    and fall back to disk, while the source keeps advertising Ready and serving inference normally. Loading stays
    correct, but P2P is effective'

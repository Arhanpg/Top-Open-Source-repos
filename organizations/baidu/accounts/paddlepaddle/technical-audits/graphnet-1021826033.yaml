analysis:
  purpose: '**GraphNet** is a large-scale dataset of deep learning **computation graphs**, built as a standard benchmark
    for **tensor compiler** optimization. It provides over 2.7K computation graphs extracted from state-of-the-art
    deep learning models spanning diverse tasks and ML frameworks. With standardized formats and rich metadata,
    GraphNet enables fair comparison and reproducible evaluation of the general optimization capabilities of tensor
    compilers, thereby supporting advanced research such as AI for System on Compilers.'

analysis:
  purpose: 'We are happy to announce that Google Cloud and SAP have expanded their partnership to enable a native
    integration between Google Workspace and SAP S/4HANA. Our customers now have the possibility to export data
    from all important UI Tables to Google Sheets as well as a table import from Google Sheets to the Upload General
    Journal Entries application. This initial set of features is included in **SAP S/4HANA Cloud 2208 and S/4HANA
    2022**, leveraging an SAP Business Technology Platform service (additional license required: SAP Document Management
    Service, integration option).'

  setup_and_usage:
  - 'Download and Installation: Use the abapGit plug-in to install the ABAP File Uploader Examples by executing
    the following steps:'
  - 'Download and Installation: 1. In your ABAP cloud project, create an ABAP package for the demo content to be
    downloaded (leave the suggested values unchanged when following the steps in the package creation wizard).'
  - 'Download and Installation: 2. To add the abapGit Repositories view to the ABAP perspective, click Window >
    Show View > Other... from the menu bar and choose abapGit Repositories.'
  - 'Download and Installation: 3. In the abapGit Repositories view, click the + icon to clone an abapGit repository.'
  - 'Download and Installation: 4. Enter the following URL of this repository: https://github.com/SAP-samples/abap-file-uploader
    and choose Next .'
  - 'Download and Installation: 5. Create a new transport request that you only use for this demo content installation
    (recommendation) and choose Finish to link the Git repository to your ABAP cloud project. The repository appears
    in the abapGit Repositories View with status Linked .'
  - 'Download and Installation: 6. Right-click on the new ABAP repository and choose pull to start the cloning of
    the repository contents. Note that this procedure may take a few minutes.'
  - 'Download and Installation: 7. Once the cloning has finished, the status is set to Pulled Successfully. Then
    refresh your project tree.'

analysis:
  purpose: The repository contains the list of released APIs of SAP Cloud ERP. In addition also the objects that
    are not released are contained with the specification of successor objects. All objects are contained in one
    JSON file. This file is used as content for the ABAP Test Cockpit Check "Usage of Released APIs (Cloudification
    Repository)". This check can be used by customers and partners to analyse existing custom code concerning the
    usage of released and not released APIs on all ECC and S/4HANA releases. The check is available in SAP BTP,
    ABAP environment in an latest version.
  why_used: ABAP test cockpit cloud readiness check variants for SAP S/4HANA Cloud

analysis:
  purpose: This plugin adds support for the Open Resource Discovery (ORD) protocol for CAP based applications. When
    you add the ORD plugin, your application gains a single entry point, which allows to discover and gather machine-readable
    information or metadata about the application. You can use this information to construct a static metadata catalog
    or to perform a detailed runtime inspection of your actual system instances / system landscapes.
  why_used: Open Resource Discovery (ORD) is a protocol that allows applications and services to self-describe their
    exposed resources and capabilities. This plugin enables generation of ORD document for CAP based applications.

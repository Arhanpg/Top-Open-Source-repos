analysis:
  purpose: BTP Manager is an operator for the SAP BTP service operator based on the Kubebuilder framework. It extends
    Kubernetes API by providing BtpOperator CustomResourceDefinition (CRD), which allows you to manage the SAP BTP
    service operator resource through custom resource (CR). BTP Manager and the SAP BTP service operator constitute
    the SAP BTP Operator module.
  why_used: BTP Manager installs SAP BTP Service Operator as a Kyma module

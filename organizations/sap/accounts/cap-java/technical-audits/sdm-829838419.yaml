analysis:
  purpose: The com.sap.cds:sdm dependency is a CAP Java plugin that provides an easy CAP-level integration with
    SAP Document Management Service. This package supports handling of attachments(documents) by using an aspect
    Attachments in SAP Document Management Service. This plugin can be consumed by the CAP application deployed
    on BTP to store their documents in the form of attachments in Document Management Repository.

analysis:
  purpose: A tutorial hosting platform for developers.sap.com that replaces both Adobe Experience Manager (AEM)
    and the legacy Java IMS backend. Fetches tutorial markdown from the sap-tutorials GitHub organization at build
    time, renders static pages with SAP Fundamental Styles (Horizon theme) via Hugo, and deploys on SAP BTP Cloud
    Foundry behind an AppRouter with XSUAA authentication. The CAP Node.js backend provides progress tracking, event
    management, and all services previously handled by the Spring Boot IMS application.
  why_used: Tutorial platform IMS - Hugo-based site with SAP Fundamental Styles and BTP Backend

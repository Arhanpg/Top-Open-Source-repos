analysis:
  purpose: A Prometheus exporter that runs custom OpenSearch queries on a schedule and exposes results as metrics.
    Designed for Kubernetes deployments where teams define their own queries via ConfigMaps.
  why_used: A Prometheus exporter for OpenSearch queries
  core_features:
  - name: '**Query-focused**: Only exposes metrics you define, no noise from cluster internals'
    description: '**Query-focused**: Only exposes metrics you define, no noise from cluster internals'
    evidence:
    - README.md#Features
  - name: '**Secure**: TLS-only with credential failover support'
    description: '**Secure**: TLS-only with credential failover support'
    evidence:
    - README.md#Features
  - name: '**Efficient**: Concurrent background query execution, minimal footprint'
    description: '**Efficient**: Concurrent background query execution, minimal footprint'
    evidence:
    - README.md#Features
  - name: '**Resilient**: Configurable error handling (preserve/drop/zero) per query'
    description: '**Resilient**: Configurable error handling (preserve/drop/zero) per query'
    evidence:
    - README.md#Features
  - name: '**Safe**: max_query_range rejects queries that would hit warm/cold storage'
    description: '**Safe**: max_query_range rejects queries that would hit warm/cold storage'
    evidence:
    - README.md#Features
  - name: '**Kubernetes-native**: Health probes, env var expansion in config, ConfigMap-friendly'
    description: '**Kubernetes-native**: Health probes, env var expansion in config, ConfigMap-friendly'
    evidence:
    - README.md#Features
